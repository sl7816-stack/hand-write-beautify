<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>手寫字 / 書法數位化合成工具 (v0.3.3)</title>
  <meta name="theme-color" content="#0f172a">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #6366f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    h2 { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; }

    .tag {
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn {
      background: #334155;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
      flex: 1;
      text-align: center;
    }

    .btn:hover:not(:disabled) { background: #475569; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .section {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .sec-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .ctrl-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    
    label { font-size: 0.85rem; display: flex; justify-content: space-between; width: 100%; }
    .val { color: var(--primary); font-family: monospace; }

    input[type="file"], select, input[type="color"] {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      outline: none;
    }

    input[type="file"] { width: 100%; }
    input[type="range"] { width: 100%; accent-color: var(--primary); }
    select { flex: 1; }
    input[type="color"] { padding: 2px; width: 36px; height: 32px; cursor: pointer; }

    .canvas-wrap {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #090d16;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      max-width: 100%;
      height: auto;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    canvas:active { cursor: grabbing; }

    .btn-dl {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      width: 100%;
      margin-top: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    #loading {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(2px);
      justify-content: center;
      align-items: center;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.95rem;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h2>手寫字 / 書法數位化合成</h2>
    <span class="tag">v0.3.3</span>
  </header>

  <div class="btn-group">
    <button class="btn" id="undoBtn" disabled>↩ 上一步</button>
    <button class="btn" id="redoBtn" disabled>↪ 下一步</button>
  </div>

  <div class="section">
    <div class="sec-title">1. 上傳手寫字照片</div>
    <input type="file" id="textInput" accept="image/*,.heic,.HEIC">
  </div>

  <div class="section">
    <div class="sec-title">2. 模式與風格參數</div>
    <div class="ctrl-grid">
      <select id="modeSelect">
        <option value="calligraphy">毛筆 / 書法模式</option>
        <option value="fine">硬筆字模式</option>
      </select>

      <label class="row" style="cursor:pointer;">
        <input type="checkbox" id="flatFieldToggle" checked style="accent-color:var(--primary);">
        <span>自動平場校正 (消除紙痕與光影)</span>
      </label>

      <div>
        <label>去背靈敏度 (抑制背景紙痕) <span class="val" id="sensVal">50</span></label>
        <input type="range" id="sensitivity" min="0" max="100" value="50">
      </div>

      <div>
        <label>文字區塊大小 <span class="val" id="scaleVal">100%</span></label>
        <input type="range" id="textScale" min="10" max="250" value="100">
      </div>

      <div class="row" style="justify-content: space-between;">
        <div class="row">
          <span style="font-size:0.85rem;">字色</span>
          <input type="color" id="textColor" value="#FFFFFF">
        </div>
        <div class="row">
          <span style="font-size:0.85rem;">底色</span>
          <select id="textBgType">
            <option value="transparent">透明</option>
            <option value="white">白色</option>
            <option value="black">黑色</option>
            <option value="custom">自訂</option>
          </select>
          <input type="color" id="textBgColor" value="#FFF9C4" style="display:none;">
        </div>
      </div>

      <button class="btn" id="resetPosBtn" style="padding:4px 8px;">置中復位</button>
    </div>
  </div>

  <div class="section">
    <div class="sec-title">3. 上傳背景圖片</div>
    <input type="file" id="bgInput" accept="image/*,.heic,.HEIC">
  </div>

  <div class="section">
    <div class="sec-title">4. 畫布預覽與操作</div>
    <div class="canvas-wrap">
      <div id="loading">處理中...</div>
      <canvas id="mainCanvas"></canvas>
    </div>

    <div class="row" style="margin-top: 12px;">
      <span style="font-size:0.85rem; width: 110px;">下載解析度：</span>
      <select id="exportSizeSelect">
        <option value="720">720p</option>
        <option value="1080" selected>1080p (標準高清)</option>
        <option value="2160">4K (極致畫質)</option>
        <option value="original">原始解析度</option>
      </select>
    </div>

    <button class="btn-dl" id="downloadBtn">下載合成圖片 (無浮水印高清版)</button>
  </div>
</div>

<script id="workerCode" type="javascript/worker">
  self.onmessage = function(e) {
    const { imgDataData, width: w, height: h, mode, sensitivity, hexColor, enableFlatField } = e.data;

    let gray = new Uint8Array(w * h);
    for (let i = 0; i < imgDataData.length; i += 4) {
      gray[i / 4] = (imgDataData[i] * 38 + imgDataData[i + 1] * 75 + imgDataData[i + 2] * 15) >> 7;
    }

    if (enableFlatField) {
      const scaleFactor = 16; 
      const sw = Math.max(1, Math.floor(w / scaleFactor));
      const sh = Math.max(1, Math.floor(h / scaleFactor));
      let smallGray = new Uint8Array(sw * sh);
      for (let sy = 0; sy < sh; sy++) {
        for (let sx = 0; sx < sw; sx++) {
          smallGray[sy * sw + sx] = gray[Math.min(h - 1, sy * scaleFactor) * w + Math.min(w - 1, sx * scaleFactor)];
        }
      }
      for (let y = 0; y < h; y++) {
        let sy = Math.min(sh - 1, Math.floor(y / scaleFactor));
        for (let x = 0; x < w; x++) {
          let bgVal = smallGray[sy * sw + Math.min(sw - 1, Math.floor(x / scaleFactor))];
          let idx = y * w + x;
          if (bgVal > 0) {
            let norm = (gray[idx] / bgVal) * 235;
            gray[idx] = norm > 255 ? 255 : norm;
          }
        }
      }
    }

    const integral = new Float64Array(w * h);
    for (let x = 0; x < w; x++) {
      let sum = 0;
      for (let y = 0; y < h; y++) {
        sum += gray[y * w + x];
        integral[y * w + x] = (x === 0) ? sum : integral[y * w + (x - 1)] + sum;
      }
    }

    const s = Math.floor(Math.max(16, Math.floor(Math.min(w, h) / 14)) / 2);
    const C = 2 + (sensitivity / 100) * 28;

    const r = parseInt(hexColor.slice(1, 3), 16);
    const g = parseInt(hexColor.slice(3, 5), 16);
    const b = parseInt(hexColor.slice(5, 7), 16);

    let alphaMap = new Uint8Array(w * h);

    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) {
        const idx = y * w + x;
        const rawGray = gray[idx];
        const x1 = Math.max(x - s, 0);
        const x2 = Math.min(x + s, w - 1);
        const y1 = Math.max(y - s, 0);
        const y2 = Math.min(y + s, h - 1);
        const count = (x2 - x1) * (y2 - y1);
        const sum = integral[y2 * w + x2] - integral[y1 * w + x2] - integral[y2 * w + x1] + integral[y1 * w + x1];
        const threshold = (sum / count) - C;

        if (rawGray < threshold) {
          let alpha = (threshold - rawGray) * 18;
          alphaMap[idx] = alpha > 255 ? 255 : Math.floor(alpha);
        } else {
          alphaMap[idx] = 0;
        }
      }
    }

    const outputData = new Uint8ClampedArray(w * h * 4);
    for (let i = 0; i < w * h; i++) {
      const idx = i * 4;
      outputData[idx] = r;
      outputData[idx + 1] = g;
      outputData[idx + 2] = b;
      outputData[idx + 3] = alphaMap[i];
    }

    self.postMessage({ outputData, width: w, height: h }, [outputData.buffer]);
  };
</script>

<script>
  const workerBlob = new Blob([document.getElementById('workerCode').textContent], { type: 'text/javascript' });
  const worker = new Worker(URL.createObjectURL(workerBlob));

  const mainCanvas = document.getElementById('mainCanvas');
  const ctx = mainCanvas.getContext('2d');
  const loading = document.getElementById('loading');
  const processedTextCanvas = document.createElement('canvas');

  let textImg = null;
  let bgImg = null;
  let textPosX = null;
  let textPosY = null;

  let isDragging = false;
  let startX = 0, startY = 0;
  let debounceTimer = null;

  const historyStack = [];
  const redoStack = [];

  const $ = id => document.getElementById(id);

  function showLoading(show, text="處理中...") {
    loading.textContent = text;
    loading.style.display = show ? 'flex' : 'none';
  }

  function saveState() {
    if (historyStack.length > 15) historyStack.shift();
    historyStack.push({
      textPosX, textPosY,
      scale: $('textScale').value,
      sens: $('sensitivity').value,
      color: $('textColor').value,
      bgType: $('textBgType').value,
      bgColor: $('textBgColor').value,
      mode: $('modeSelect').value,
      flatField: $('flatFieldToggle').checked
    });
    redoStack.length = 0;
    updateUndoRedoBtns();
  }

  function updateUndoRedoBtns() {
    $('undoBtn').disabled = historyStack.length <= 1;
    $('redoBtn').disabled = redoStack.length === 0;
  }

  function applyState(state) {
    textPosX = state.textPosX;
    textPosY = state.textPosY;
    $('textScale').value = state.scale;
    $('scaleVal').textContent = state.scale + '%';
    $('sensitivity').value = state.sens;
    $('sensVal').textContent = state.sens;
    $('textColor').value = state.color;
    $('textBgType').value = state.bgType;
    $('textBgColor').value = state.bgColor;
    $('modeSelect').value = state.mode;
    $('flatFieldToggle').checked = state.flatField;
    
    $('textBgColor').style.display = (state.bgType === 'custom') ? 'inline-block' : 'none';
    processText();
  }

  $('undoBtn').addEventListener('click', () => {
    if (historyStack.length <= 1) return;
    redoStack.push(historyStack.pop());
    applyState(historyStack[historyStack.length - 1]);
    updateUndoRedoBtns();
  });

  $('redoBtn').addEventListener('click', () => {
    if (redoStack.length === 0) return;
    const state = redoStack.pop();
    historyStack.push(state);
    applyState(state);
    updateUndoRedoBtns();
  });

  function processText() {
    if (!textImg) return;
    showLoading(true, "去背運算中...");

    const temp = document.createElement('canvas');
    temp.width = textImg.width;
    temp.height = textImg.height;
    const tCtx = temp.getContext('2d');
    tCtx.drawImage(textImg, 0, 0);
    const imgData = tCtx.getImageData(0, 0, temp.width, temp.height);

    worker.postMessage({
      imgDataData: imgData.data,
      width: temp.width,
      height: temp.height,
      mode: $('modeSelect').value,
      enableFlatField: $('flatFieldToggle').checked,
      sensitivity: parseInt($('sensitivity').value, 10),
      hexColor: $('textColor').value
    });
  }

  worker.onmessage = function(e) {
    const { outputData, width, height } = e.data;
    processedTextCanvas.width = width;
    processedTextCanvas.height = height;
    const pCtx = processedTextCanvas.getContext('2d');
    const imgData = pCtx.createImageData(width, height);
    imgData.data.set(outputData);
    pCtx.putImageData(imgData, 0, 0);
    showLoading(false);
    render();
  };

  function render(isExport = false, exportScale = 1) {
    let tw = bgImg ? bgImg.width : (textImg ? textImg.width : 800);
    let th = bgImg ? bgImg.height : (textImg ? textImg.height : 600);

    mainCanvas.width = tw;
    mainCanvas.height = th;

    if (bgImg) {
      ctx.drawImage(bgImg, 0, 0, tw, th);
    } else {
      ctx.clearRect(0, 0, tw, th);
    }

    if (textImg && processedTextCanvas.width > 0) {
      const scaleVal = parseInt($('textScale').value, 10) / 100;
      const baseFitScale = Math.min(tw / processedTextCanvas.width, th / processedTextCanvas.height);
      const rw = processedTextCanvas.width * baseFitScale * scaleVal;
      const rh = processedTextCanvas.height * baseFitScale * scaleVal;

      if (textPosX === null) textPosX = (tw - rw) / 2;
      if (textPosY === null) textPosY = (th - rh) / 2;

      const bgType = $('textBgType').value;
      if (bgType !== 'transparent') {
        if (bgType === 'black') ctx.fillStyle = '#000000';
        else if (bgType === 'white') ctx.fillStyle = '#ffffff';
        else if (bgType === 'custom') ctx.fillStyle = $('textBgColor').value;
        ctx.fillRect(textPosX, textPosY, rw, rh);
      }

      ctx.drawImage(processedTextCanvas, textPosX, textPosY, rw, rh);
    }
  }

  $('textInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    showLoading(true, "載入圖片中...");
    const r = new FileReader();
    r.onload = (evt) => {
      const img = new Image();
      img.onload = () => {
        textImg = img;
        textPosX = null;
        textPosY = null;
        historyStack.length = 0;
        saveState();
        processText();
      };
      img.src = evt.target.result;
    };
    r.readAsDataURL(file);
  });

  $('bgInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = (evt) => {
      bgImg = new Image();
      bgImg.onload = () => render();
      bgImg.src = evt.target.result;
    };
    r.readAsDataURL(file);
  });

  $('sensitivity').addEventListener('input', (e) => {
    $('sensVal').textContent = e.target.value;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => { saveState(); processText(); }, 200);
  });

  $('textScale').addEventListener('input', (e) => {
    $('scaleVal').textContent = e.target.value + '%';
    render();
  });
  $('textScale').addEventListener('change', () => saveState());

  $('textColor').addEventListener('change', () => { saveState(); processText(); });
  $('flatFieldToggle').addEventListener('change', () => { saveState(); processText(); });
  $('modeSelect').addEventListener('change', () => { saveState(); processText(); });

  $('textBgType').addEventListener('change', (e) => {
    $('textBgColor').style.display = (e.target.value === 'custom') ? 'inline-block' : 'none';
    saveState();
    render();
  });
  $('textBgColor').addEventListener('change', () => { saveState(); render(); });

  $('resetPosBtn').addEventListener('click', () => {
    textPosX = null;
    textPosY = null;
    saveState();
    render();
  });

  function getCanvasCoords(e) {
    const rect = mainCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const scaleX = mainCanvas.width / rect.width;
    const scaleY = mainCanvas.height / rect.height;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function startDrag(e) {
    if (!textImg) return;
    isDragging = true;
    const pos = getCanvasCoords(e);
    startX = pos.x - (textPosX || 0);
    startY = pos.y - (textPosY || 0);
  }

  function drag(e) {
    if (!isDragging) return;
    e.preventDefault();
    const pos = getCanvasCoords(e);
    textPosX = pos.x - startX;
    textPosY = pos.y - startY;
    render();
  }

  function stopDrag() {
    if (isDragging) {
      isDragging = false;
      saveState();
    }
  }

  mainCanvas.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', drag);
  window.addEventListener('mouseup', stopDrag);

  mainCanvas.addEventListener('touchstart', startDrag, { passive: false });
  window.addEventListener('touchmove', drag, { passive: false });
  window.addEventListener('touchend', stopDrag);

  $('downloadBtn').addEventListener('click', () => {
    if (!textImg && !bgImg) return;
    render(true);
    const a = document.createElement('a');
    a.download = `handwriting_v0.3.3.png`;
    a.href = mainCanvas.toDataURL('image/png');
    a.click();
    render(false);
  });

  mainCanvas.width = 800;
  mainCanvas.height = 600;
  ctx.fillStyle = '#090d16';
  ctx.fillRect(0, 0, 800, 600);
  ctx.fillStyle = '#64748b';
  ctx.font = '16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('請上傳手寫字照片以開始', 400, 300);
</script>
</body>
</html>
