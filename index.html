<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手寫字/書法數位化合成工具 V0.3.0</title>
    <!-- Manifest for PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1d24">
    
    <style>
        :root {
            --bg-color: #121418;
            --card-bg: #1a1d24;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --text-color: #e2e8f0;
            --border-color: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.3rem;
            color: #ffffff;
        }

        header .version {
            font-size: 0.8rem;
            color: #a0aec0;
            margin-top: 3px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .card h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #cbd5e0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .row-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        input[type="file"], select, input[type="color"] {
            width: 100%;
            padding: 10px;
            background-color: #2d3748;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        input[type="color"] {
            height: 40px;
            padding: 2px;
            cursor: pointer;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #4a5568;
            border-radius: 3px;
            outline: none;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:active {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #4a5568;
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .btn-danger {
            background-color: #e53e3e;
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 450px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        .watermark {
            position: absolute;
            color: rgba(255, 255, 255, 0.25);
            font-size: 1.2rem;
            pointer-events: none;
            transform: rotate(-30deg);
            white-space: nowrap;
        }

        .watermark-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            align-items: center;
            justify-items: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>手寫字 / 書法數位化合成工具</h1>
        <div class="version">版本號 V0.3.0</div>
    </header>

    <!-- 1. 上傳書法字與去背設定 -->
    <div class="card">
        <h3>1. 上傳書法字與去背處理</h3>
        <input type="file" id="calligraphyInput" accept="image/*">
        
        <div class="control-group">
            <label>
                去背靈敏度 (去除紙色): <span id="thresholdVal">80</span>
            </label>
            <input type="range" id="threshold" min="0" max="255" value="80">
        </div>
    </div>

    <!-- 2. 書法字外觀與變形調整 -->
    <div class="card">
        <h3>2. 書法字色彩與樣式調整</h3>
        <div class="control-group">
            <div class="row-group">
                <label style="flex: 2;">
                    墨跡顏色:
                    <select id="colorMode">
                        <option value="original">保持原色 (Original)</option>
                        <option value="black">純黑 (Black)</option>
                        <option value="white">純白 (White)</option>
                        <option value="gold">金色 (Gold)</option>
                        <option value="vermilion">朱紅 (Vermilion)</option>
                        <option value="custom">自訂顏色 (Custom)</option>
                    </select>
                </label>
                <div id="customColorPicker" style="display: none; flex: 1;">
                    <input type="color" id="textColor" value="#ffffff">
                </div>
            </div>

            <label>
                不透明度 (Opacity): <span id="opacityVal">100%</span>
            </label>
            <input type="range" id="opacity" min="0" max="100" value="100">

            <label>
                旋轉角度 (Rotate): <span id="rotateVal">0°</span>
            </label>
            <input type="range" id="rotate" min="-180" max="180" value="0">
        </div>
    </div>

    <!-- 3. 上傳背景圖 -->
    <div class="card">
        <h3>3. 上傳背景圖片</h3>
        <input type="file" id="bgInput" accept="image/*">
        <div class="row-group" style="margin-top: 10px;">
            <button class="btn btn-secondary" onclick="resetTransform()">置中復位</button>
            <button class="btn btn-danger" onclick="resetAll()">重置所有參數</button>
        </div>
    </div>

    <!-- 4. 畫布預覽區 -->
    <div class="card">
        <h3>4. 畫布預覽與操作 (單指拖曳 / 雙指縮放)</h3>
        <div class="canvas-container" id="canvasContainer">
            <canvas id="mainCanvas"></canvas>
            <div class="watermark-grid">
                <div class="watermark">預覽專用 PREVIEW</div>
                <div class="watermark">預覽專用 PREVIEW</div>
                <div class="watermark">預覽專用 PREVIEW</div>
                <div class="watermark">預覽專用 PREVIEW</div>
                <div class="watermark">預覽專用 PREVIEW</div>
                <div class="watermark">預覽專用 PREVIEW</div>
            </div>
        </div>
    </div>

    <!-- 5. 下載區 -->
    <div class="card">
        <h3>5. 圖片下載</h3>
        <button class="btn" onclick="exportImage()">下載合成圖檔</button>
    </div>
</div>

<script>
    const mainCanvas = document.getElementById('mainCanvas');
    const ctx = mainCanvas.getContext('2d');

    let bgImage = null;
    let calligImage = null;
    let processedCalligCanvas = document.createElement('canvas');

    let scale = 1.0;
    let posX = 0;
    let posY = 0;
    let rotationAngle = 0;
    let opacityValue = 1.0;

    let isDragging = false;
    let startX, startY;
    let initialPinchDistance = null;
    let initialScale = 1.0;

    document.getElementById('calligraphyInput').addEventListener('change', handleCalligraphyUpload);
    document.getElementById('bgInput').addEventListener('change', handleBgUpload);

    const thresholdInput = document.getElementById('threshold');
    thresholdInput.addEventListener('input', (e) => {
        document.getElementById('thresholdVal').innerText = e.target.value;
        if (calligImage) { processCalligraphy(); render(); }
    });

    document.getElementById('opacity').addEventListener('input', (e) => {
        opacityValue = e.target.value / 100;
        document.getElementById('opacityVal').innerText = e.target.value + '%';
        render();
    });

    document.getElementById('rotate').addEventListener('input', (e) => {
        rotationAngle = parseInt(e.target.value, 10);
        document.getElementById('rotateVal').innerText = rotationAngle + '°';
        render();
    });

    const colorModeSelect = document.getElementById('colorMode');
    const customColorPicker = document.getElementById('customColorPicker');
    colorModeSelect.addEventListener('change', (e) => {
        if (e.target.value === 'custom') {
            customColorPicker.style.display = 'block';
        } else {
            customColorPicker.style.display = 'none';
        }
        if (calligImage) { processCalligraphy(); render(); }
    });

    document.getElementById('textColor').addEventListener('input', () => {
        if (calligImage) { processCalligraphy(); render(); }
    });

    function processCalligraphy() {
        if (!calligImage) return;

        const w = calligImage.width;
        const h = calligImage.height;

        processedCalligCanvas.width = w;
        processedCalligCanvas.height = h;
        const pCtx = processedCalligCanvas.getContext('2d');
        pCtx.drawImage(calligImage, 0, 0);

        const imgData = pCtx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const threshold = parseInt(thresholdInput.value, 10);
        const colorMode = colorModeSelect.value;
        const customColorHex = document.getElementById('textColor').value;

        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            let brightness = (r * 0.299 + g * 0.587 + b * 0.114);

            if (brightness > threshold) {
                data[i + 3] = 0;
            }
        }

        if (colorMode !== 'original') {
            let targetR = 0, targetG = 0, targetB = 0;

            if (colorMode === 'black') { targetR = 0; targetG = 0; targetB = 0; }
            else if (colorMode === 'white') { targetR = 255; targetG = 255; targetB = 255; }
            else if (colorMode === 'gold') { targetR = 212; targetG = 175; targetB = 55; }
            else if (colorMode === 'vermilion') { targetR = 227; targetG = 66; targetB = 52; }
            else if (colorMode === 'custom') {
                const rgb = hexToRgb(customColorHex);
                targetR = rgb.r; targetG = rgb.g; targetB = rgb.b;
            }

            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] > 0) {
                    data[i] = targetR;
                    data[i + 1] = targetG;
                    data[i + 2] = targetB;
                }
            }
        }

        pCtx.putImageData(imgData, 0, 0);
    }

    function hexToRgb(hex) {
        let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : { r: 255, g: 255, b: 255 };
    }

    function handleCalligraphyUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            calligImage = new Image();
            calligImage.onload = () => {
                resetTransform();
                processCalligraphy();
                render();
            };
            calligImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function handleBgUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            bgImage = new Image();
            bgImage.onload = () => {
                mainCanvas.width = bgImage.width;
                mainCanvas.height = bgImage.height;
                resetTransform();
                render();
            };
            bgImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function resetTransform() {
        scale = 1.0;
        posX = mainCanvas.width / 2;
        posY = mainCanvas.height / 2;
        rotationAngle = 0;
        document.getElementById('rotate').value = 0;
        document.getElementById('rotateVal').innerText = '0°';
        render();
    }

    function resetAll() {
        resetTransform();
        opacityValue = 1.0;
        document.getElementById('opacity').value = 100;
        document.getElementById('opacityVal').innerText = '100%';
        thresholdInput.value = 80;
        document.getElementById('thresholdVal').innerText = '80';
        colorModeSelect.value = 'original';
        customColorPicker.style.display = 'none';
        if (calligImage) { processCalligraphy(); }
        render();
    }

    function render() {
        if (!mainCanvas.width || !mainCanvas.height) return;

        ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);

        if (bgImage) {
            ctx.drawImage(bgImage, 0, 0);
        } else {
            ctx.fillStyle = "#222";
            ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
        }

        if (calligImage) {
            ctx.save();
            ctx.globalAlpha = opacityValue;
            ctx.translate(posX, posY);
            ctx.rotate((rotationAngle * Math.PI) / 180);
            ctx.scale(scale, scale);

            ctx.drawImage(
                processedCalligCanvas, 
                -processedCalligCanvas.width / 2, 
                -processedCalligCanvas.height / 2
            );
            ctx.restore();
        }
    }

    const container = document.getElementById('canvasContainer');

    container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            isDragging = true;
            startX = e.touches[0].clientX - posX;
            startY = e.touches[0].clientY - posY;
        } else if (e.touches.length === 2) {
            isDragging = false;
            initialPinchDistance = getPinchDistance(e.touches);
            initialScale = scale;
        }
    });

    container.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
            posX = e.touches[0].clientX - startX;
            posY = e.touches[0].clientY - startY;
            render();
        } else if (e.touches.length === 2 && initialPinchDistance) {
            const currentDistance = getPinchDistance(e.touches);
            scale = initialScale * (currentDistance / initialPinchDistance);
            render();
        }
    });

    container.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) { initialPinchDistance = null; }
        if (e.touches.length === 0) { isDragging = false; }
    });

    function getPinchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    function exportImage() {
        if (!bgImage && !calligImage) {
            alert("請先上傳圖片後再進行匯出！");
            return;
        }
        const dataURL = mainCanvas.toDataURL('image/png', 1.0);
        const link = document.createElement('a');
        link.download = `calligraphy_v0.3.0.png`;
        link.href = dataURL;
        link.click();
    }

    mainCanvas.width = 1080;
    mainCanvas.height = 1440;
    render();
</script>

</body>
</html>
