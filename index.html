<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手寫字/書法數位化合成工具 V0.3.1</title>
    <!-- Manifest for PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1d24">
    
    <style>
        :root {
            --bg-color: #121418;
            --card-bg: #1a1d24;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --text-color: #e2e8f0;
            --border-color: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.3rem;
            color: #ffffff;
        }

        header .version {
            font-size: 0.8rem;
            color: #a0aec0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .card h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #cbd5e0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        label {
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        input[type="file"], select {
            width: 100%;
            padding: 10px;
            background-color: #2d3748;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #4a5568;
            border-radius: 3px;
            outline: none;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:active {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #4a5568;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 450px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            touch-action: none; /* 防止手機滑動干擾 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        .watermark {
            position: absolute;
            color: rgba(255, 255, 255, 0.25);
            font-size: 1.2rem;
            pointer-events: none;
            transform: rotate(-30deg);
            white-space: nowrap;
        }

        .watermark-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            align-items: center;
            justify-items: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>手寫字 / 書法數位化合成工具</h1>
        <div class="version">版本號 V0.3.1 (白色雜訊過濾 + 解析度匯出)</div>
    </header>

    <!-- 1. 上傳書法字 -->
    <div class="card">
        <h3>1. 上傳書法字圖片</h3>
        <input type="file" id="calligraphyInput" accept="image/*">
        <div class="control-group">
            <label>
                去背靈敏度 (去除紙色): <span id="thresholdVal">80</span>
            </label>
            <input type="range" id="threshold" min="0" max="255" value="80">
            
            <label style="margin-top: 5px;">
                <input type="checkbox" id="enableNoiseFilter" checked> 啟用 3x3 孤立白色雜訊自動濾除
            </label>
        </div>
    </div>

    <!-- 2. 上傳背景圖 -->
    <div class="card">
        <h3>2. 上傳背景圖片</h3>
        <input type="file" id="bgInput" accept="image/*">
        <div style="margin-top: 10px;">
            <button class="btn btn-secondary" onclick="resetTransform()">置中復位</button>
        </div>
    </div>

    <!-- 3. 畫布預覽區 -->
    <div class="card">
        <h3>3. 畫布預覽與操作 (可拖曳與雙指縮放書法)</h3>
        <div class="canvas-container" id="canvasContainer">
            <canvas id="mainCanvas"></canvas>
            <div class="watermark-grid">
                <div class="watermark">預覽專用 PREVIEW</div>
                <div class="watermark">預覽專用 PREVIEW</div>
                <div class="watermark">預覽專用 PREVIEW</div>
                <div class="watermark">預覽專用 PREVIEW</div>
                <div class="watermark">預覽專用 PREVIEW</div>
                <div class="watermark">預覽專用 PREVIEW</div>
            </div>
        </div>
    </div>

    <!-- 4. 匯出設定與下載 -->
    <div class="card">
        <h3>4. 高畫質圖片匯出</h3>
        <div class="control-group">
            <label for="exportSize"><b>匯出解析度 (寬度)：</b></label>
            <select id="exportSize">
                <option value="720">720p (輕巧版 ~1MB)</option>
                <option value="1080" selected>1080p (標準高清 ~3MB)</option>
                <option value="2160">4K (超高畫質 ~8MB)</option>
                <option value="original">原始解析度 (Original)</option>
            </select>
            <button class="btn" onclick="exportImage()">下載合成圖檔</button>
        </div>
    </div>
</div>

<script>
    const mainCanvas = document.getElementById('mainCanvas');
    const ctx = mainCanvas.getContext('2d');

    let bgImage = null;
    let calligImage = null;
    let processedCalligCanvas = document.createElement('canvas'); // 存放去背後的書法

    // 書法字位移與縮放狀態
    let scale = 1.0;
    let posX = 0;
    let posY = 0;

    // 手勢觸控狀態
    let isDragging = false;
    let startX, startY;
    let initialPinchDistance = null;
    let initialScale = 1.0;

    // 初始化與監聽
    document.getElementById('calligraphyInput').addEventListener('change', handleCalligraphyUpload);
    document.getElementById('bgInput').addEventListener('change', handleBgUpload);
    
    const thresholdInput = document.getElementById('threshold');
    thresholdInput.addEventListener('input', (e) => {
        document.getElementById('thresholdVal').innerText = e.target.value;
        if (calligImage) {
            processCalligraphy();
            render();
        }
    });

    document.getElementById('enableNoiseFilter').addEventListener('change', () => {
        if (calligImage) {
            processCalligraphy();
            render();
        }
    });

    // 處理書法去背 + 雜訊自動濾除 (V0.3.1 核心)
    function processCalligraphy() {
        if (!calligImage) return;

        const w = calligImage.width;
        const h = calligImage.height;

        processedCalligCanvas.width = w;
        processedCalligCanvas.height = h;
        const pCtx = processedCalligCanvas.getContext('2d');
        pCtx.drawImage(calligImage, 0, 0);

        const imgData = pCtx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const threshold = parseInt(thresholdInput.value, 10);
        const useNoiseFilter = document.getElementById('enableNoiseFilter').checked;

        // 第一階段：基礎亮度去背 (將高於閾值的白色/淺色紙改為透明)
        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            let brightness = (r * 0.299 + g * 0.587 + b * 0.114); // 標準灰階權重

            if (brightness > threshold) {
                data[i + 3] = 0; // Alpha 設為 0
            }
        }

        // 第二階段：3x3 鄰域孤立白色雜訊清理 (解決靈敏度拉高時的邊緣噪點)
        if (useNoiseFilter) {
            const alphaMap = new Uint8Array(w * h);
            for (let i = 0; i < data.length; i += 4) {
                alphaMap[i / 4] = data[i + 3];
            }

            for (let y = 1; y < h - 1; y++) {
                for (let x = 1; x < w - 1; x++) {
                    let idx = y * w + x;
                    if (alphaMap[idx] > 0) {
                        let transparentNeighbors = 0;
                        // 檢查周圍 8 個鄰居點
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                if (dx === 0 && dy === 0) continue;
                                let nIdx = (y + dy) * w + (x + dx);
                                if (alphaMap[nIdx] === 0) transparentNeighbors++;
                            }
                        }
                        // 若周圍有 6 個以上的點都是透明的，判斷為孤立雜點予以剔除
                        if (transparentNeighbors >= 6) {
                            data[idx * 4 + 3] = 0;
                        }
                    }
                }
            }
        }

        pCtx.putImageData(imgData, 0, 0);
    }

    function handleCalligraphyUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            calligImage = new Image();
            calligImage.onload = () => {
                resetTransform();
                processCalligraphy();
                render();
            };
            calligImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function handleBgUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            bgImage = new Image();
            bgImage.onload = () => {
                // 以背景圖尺寸做為 Base Canvas 規格
                mainCanvas.width = bgImage.width;
                mainCanvas.height = bgImage.height;
                resetTransform();
                render();
            };
            bgImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function resetTransform() {
        scale = 1.0;
        posX = mainCanvas.width / 2;
        posY = mainCanvas.height / 2;
        render();
    }

    // 畫面繪製重繪機制
    function render() {
        if (!mainCanvas.width || !mainCanvas.height) return;

        ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);

        // 1. 繪製背景圖
        if (bgImage) {
            ctx.drawImage(bgImage, 0, 0);
        } else {
            ctx.fillStyle = "#333";
            ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
        }

        // 2. 繪製去背書法字
        if (calligImage) {
            ctx.save();
            ctx.translate(posX, posY);
            ctx.scale(scale, scale);
            // 將書法字置中疊加
            ctx.drawImage(
                processedCalligCanvas, 
                -processedCalligCanvas.width / 2, 
                -processedCalligCanvas.height / 2
            );
            ctx.restore();
        }
    }

    // 觸控與拖曳邏輯 (雙指縮放與拖曳)
    const container = document.getElementById('canvasContainer');

    container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            isDragging = true;
            startX = e.touches[0].clientX - posX;
            startY = e.touches[0].clientY - posY;
        } else if (e.touches.length === 2) {
            isDragging = false;
            initialPinchDistance = getPinchDistance(e.touches);
            initialScale = scale;
        }
    });

    container.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
            posX = e.touches[0].clientX - startX;
            posY = e.touches[0].clientY - startY;
            render();
        } else if (e.touches.length === 2 && initialPinchDistance) {
            const currentDistance = getPinchDistance(e.touches);
            scale = initialScale * (currentDistance / initialPinchDistance);
            render();
        }
    });

    container.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
            initialPinchDistance = null;
        }
        if (e.touches.length === 0) {
            isDragging = false;
        }
    });

    function getPinchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    // 高畫質圖片匯出功能 (V0.3.1)
    function exportImage() {
        if (!bgImage && !calligImage) {
            alert("請先上傳圖片後再進行匯出！");
            return;
        }

        const sizeOption = document.getElementById('exportSize').value;
        let targetWidth = mainCanvas.width;

        if (sizeOption !== 'original') {
            targetWidth = parseInt(sizeOption, 10);
        }

        // 計算等比例高度
        const scaleFactor = targetWidth / mainCanvas.width;
        const targetHeight = Math.round(mainCanvas.height * scaleFactor);

        // 建立離屏高畫質 Canvas
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = targetWidth;
        exportCanvas.height = targetHeight;
        const exportCtx = exportCanvas.getContext('2d');

        // 開啟抗鋸齒
        exportCtx.imageSmoothingEnabled = true;
        exportCtx.imageSmoothingQuality = 'high';

        // 縮放重繪
        exportCtx.drawImage(mainCanvas, 0, 0, targetWidth, targetHeight);

        // 匯出圖檔
        const dataURL = exportCanvas.toDataURL('image/png', 1.0);
        const link = document.createElement('a');
        link.download = `calligraphy_v0.3.1_${targetWidth}p.png`;
        link.href = dataURL;
        link.click();
    }

    // 初始化 Canvas 預設尺寸
    mainCanvas.width = 1080;
    mainCanvas.height = 1440;
    render();
</script>

</body>
</html>
